name: Create course repo from template

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: create-repo-${{ github.event.issue.number }}

jobs:
  create-repo:
    # Only run on issues created from your enrollment template
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_PAT }}       # PAT with repo + admin:org
      TEMPLATE_REPO: webkollegiet-opgaver/test-opgave         # your template repo name
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
    steps:
      - name: Parse and validate fields
        id: fields
        run: |
          set -euo pipefail

          extract_field() {
            echo "$ISSUE_BODY" \
              | awk -v field="### $1" 'index($0, field) == 1 {found=1; next}
                                      found && NF {print; exit}'
          }

          RAW_NAME=$(extract_field "Name")
          GITHUB_USERNAME=$(extract_field "GitHub username")
          COURSE_ID=$(extract_field "Course ID")

          # Sanitize name: lowercase, spaces/slashes -> hyphens, keep alnum + hyphen
          SAFE_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' \
                      | tr ' /_' '-' | sed 's/[^a-z0-9-]//g' | sed 's/-\+/-/g;s/^-//;s/-$//')

          # Unique, safe repo name: courseID-githubUsername
          REPO_NAME=$(echo "${COURSE_ID}-${GITHUB_USERNAME}" \
                      | tr '[:upper:]' '[:lower:]' | tr ' /_' '-'
                      | sed 's/[^a-z0-9-]//g;s/-\+/-/g;s/^-//;s/-$//')

          if [ -z "$REPO_NAME" ] || [ -z "$GITHUB_USERNAME" ]; then
            echo "::error::Could not parse GitHub username or Course ID from issue."
            exit 1
          fi

          # Validate the GitHub user actually exists
          if ! gh api "users/$GITHUB_USERNAME" --jq .login >/dev/null 2>&1; then
            echo "::error::GitHub user '$GITHUB_USERNAME' does not exist."
            echo "invalid_user=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "username=$GITHUB_USERNAME" >> "$GITHUB_OUTPUT"
          echo "course_id=${COURSE_ID}" >> "$GITHUB_OUTPUT"

      - name: Fail gracefully on invalid user
        if: steps.fields.outputs.invalid_user == 'true'
        run: |
          gh issue comment "$ISSUE_URL" --body "❌ The GitHub username you entered doesn't exist. Please correct it and reopen this issue."
          gh issue close "$ISSUE_URL" --reason "not planned"
          exit 0

      - name: Check repo doesn't already exist
        id: exists
        continue-on-error: true
        run: gh api "repos/${{ github.repository_owner }}/${{ steps.fields.outputs.repo_name }}" --jq .full_name

      - name: Create repo from template
        if: steps.exists.outcome == 'failure'
        run: |
          gh repo create "${{ github.repository_owner }}/${{ steps.fields.outputs.repo_name }}" \
            --template "${{ github.repository_owner }}/$TEMPLATE_REPO" \
            --private \
            --description "Course repo for @${{ steps.fields.outputs.username }} (${{ steps.fields.outputs.safe_name }})"

      - name: Add student as collaborator
        if: steps.exists.outcome == 'failure'
        run: |
          gh api -X PUT \
            "repos/${{ github.repository_owner }}/${{ steps.fields.outputs.repo_name }}/collaborators/${{ steps.fields.outputs.username }}" \
            -f permission=push

      - name: Report success on the issue
        if: steps.exists.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE_URL" --body \
            "✅ Your repo is ready: **${{ steps.fields.outputs.repo_name }}**
          You've been added as a collaborator with push access. You should receive an invitation — accept it here: https://github.com/${{ github.repository_owner }}/${{ steps.fields.outputs.repo_name }}/invitations"
          gh issue close "$ISSUE_URL" --reason completed
          gh issue edit "$ISSUE_URL" --add-label "provisioned"

      - name: Repo already exists — inform user
        if: steps.exists.outcome == 'success'
        run: |
          gh issue comment "$ISSUE_URL" --body \
            "⚠️ A repo named **${{ steps.fields.outputs.repo_name }}** already exists. If this wasn't you, contact an instructor."
          gh issue close "$ISSUE_URL" --reason "not planned"
